{{- if not .Values.secrets.existingSecret }}
{{- /* Generated once: an upgrade reads the Secret back (lookup) and keeps every value. */}}
{{- $name := include "cloudhal.fullname" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $old "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cloudhal.labels" . | nindent 4 }}
  annotations:
    # Never deleted with the release: the site id and the cluster key must outlive reinstalls.
    helm.sh/resource-policy: keep
type: Opaque
data:
  CLOUDHAL_SITE_ID: {{ get $data "CLOUDHAL_SITE_ID" | default (printf "site_%s" (randAlphaNum 20 | upper) | b64enc) }}
  AWS_ACCESS_KEY_ID: {{ get $data "AWS_ACCESS_KEY_ID" | default (printf "cloudhal%s" (randAlphaNum 16 | lower) | b64enc) }}
  {{- range $key := splitList " " (include "cloudhal.secretKeys" .) }}
  {{ $key }}: {{ get $data $key | default (randAlphaNum 64 | b64enc) }}
  {{- end }}
{{- end }}
