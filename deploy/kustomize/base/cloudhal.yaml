---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudhal
  labels:
    app.kubernetes.io/name: cloudhal
    app.kubernetes.io/instance: cloudhal
    app.kubernetes.io/version: "0.10.1"
    app.kubernetes.io/component: cloudhal
spec:
  replicas: 1
  # Stable names, so each instance advertises <pod>.<release>-peers to its peers.
  serviceName: cloudhal-peers
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudhal
      app.kubernetes.io/instance: cloudhal
      app.kubernetes.io/component: cloudhal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudhal
        app.kubernetes.io/instance: cloudhal
        app.kubernetes.io/version: "0.10.1"
        app.kubernetes.io/component: cloudhal
      annotations:
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudhal
          image: "ghcr.io/cloudhal-dev/cloudhal:0.10.1"
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: cloudhal
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLOUDHAL_CLUSTER_ADVERTISE
              value: "$(POD_NAME).cloudhal-peers:7000"
            - name: CLOUDHAL_S3_ENDPOINT
              value: "http://cloudhal-store:8333"
            - name: CLOUDHAL_S3_BUCKET
              value: "cloudhal"
            - name: CLOUDHAL_S3_PREFIX
              value: ""
            - name: CLOUDHAL_S3_REGION
              value: "us-east-1"
            - name: CLOUDHAL_SITE_NAME
              value: "My site"
            - name: CLOUDHAL_BASE_URL
              value: ""
            - name: CLOUDHAL_BEHIND_PROXY
              value: "0"
          ports:
            - name: studio
              containerPort: 8787
            - name: site
              containerPort: 8788
            - name: cluster
              containerPort: 7000
          startupProbe:
            httpGet: { path: /api/health, port: studio }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /api/health, port: studio }
            periodSeconds: 10
            timeoutSeconds: 5
            # A peer's lease takes ~20 s to expire after it dies; health fails until then.
            failureThreshold: 6
          readinessProbe:
            # 200 while the instance serves, holds its lease and is not stopping.
            httpGet: { path: /ready, port: cluster }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

---
# SeaweedFS (Apache-2.0), the installation's S3 store: one pod with its volume. Its credentials
# are the release Secret's AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudhal-store
  labels:
    app.kubernetes.io/name: cloudhal
    app.kubernetes.io/instance: cloudhal
    app.kubernetes.io/version: "0.10.1"
    app.kubernetes.io/component: store
spec:
  replicas: 1
  serviceName: cloudhal-store
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudhal
      app.kubernetes.io/instance: cloudhal
      app.kubernetes.io/component: store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudhal
        app.kubernetes.io/instance: cloudhal
        app.kubernetes.io/version: "0.10.1"
        app.kubernetes.io/component: store
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: "chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15"
          command: ["/bin/sh", "-c"]
          args:
            - |
              umask 077
              printf '{"identities":[{"name":"cloudhal","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
                "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > /tmp/s3.json
              exec weed server -dir=/data -ip=$(POD_IP) -ip.bind=0.0.0.0 -s3 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cloudhal
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudhal
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: master, containerPort: 9333 }
            - { name: master-grpc, containerPort: 19333 }
            - { name: filer, containerPort: 8888 }
            - { name: filer-grpc, containerPort: 18888 }
          readinessProbe:
            httpGet: { path: /cluster/status, port: master }
            periodSeconds: 5
          resources:
            {}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: store
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: store
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
