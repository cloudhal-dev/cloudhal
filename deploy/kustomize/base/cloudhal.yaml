# Generated by scripts/kustomize-base.sh from deploy/helm/cloudhal. Do not edit.
---
# The cluster port grants full control of every instance (its traffic is not encrypted): only this
# release's own instances may reach it. Studio and the site stay open to the cluster's ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudhal
  labels:
    app.kubernetes.io/name: cloudhal
    app.kubernetes.io/instance: cloudhal
    app.kubernetes.io/version: "0.10.1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudhal
      app.kubernetes.io/instance: cloudhal
      app.kubernetes.io/component: cloudhal
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8787
        - port: 8788
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudhal
              app.kubernetes.io/instance: cloudhal
              app.kubernetes.io/component: cloudhal
      ports:
        - port: 7000

---
# Studio, the API, /mcp and the site, on any ready instance.
apiVersion: v1
kind: Service
metadata:
  name: cloudhal
  labels:
    app.kubernetes.io/name: cloudhal
    app.kubernetes.io/instance: cloudhal
    app.kubernetes.io/version: "0.10.1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudhal
    app.kubernetes.io/instance: cloudhal
    app.kubernetes.io/component: cloudhal
  ports:
    - name: studio
      port: 8787
      targetPort: studio
    - name: site
      port: 8788
      targetPort: site

---
# The peers' names (<pod>.<release>-peers), resolvable before a pod is ready: an instance joins the
# cluster, and becomes ready, only once it can reach the others.
apiVersion: v1
kind: Service
metadata:
  name: cloudhal-peers
  labels:
    app.kubernetes.io/name: cloudhal
    app.kubernetes.io/instance: cloudhal
    app.kubernetes.io/version: "0.10.1"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: cloudhal
    app.kubernetes.io/instance: cloudhal
    app.kubernetes.io/component: cloudhal
  ports:
    - name: cluster
      port: 7000
      targetPort: cluster

---
apiVersion: v1
kind: Service
metadata:
  name: cloudhal-store
  labels:
    app.kubernetes.io/name: cloudhal
    app.kubernetes.io/instance: cloudhal
    app.kubernetes.io/version: "0.10.1"
spec:
  selector:
    app.kubernetes.io/name: cloudhal
    app.kubernetes.io/instance: cloudhal
    app.kubernetes.io/component: store
  ports:
    - { name: s3, port: 8333, targetPort: s3 }
