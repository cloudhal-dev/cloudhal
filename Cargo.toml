[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/cloudhal-dev/cloudhal"
homepage = "https://cloudhal.com"
authors = ["Cloudhal contributors"]

[workspace.metadata]
name = "cloudhal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.58"
regress = "0.12"
