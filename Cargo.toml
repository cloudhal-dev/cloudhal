[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/cloudhal-dev/cloudhal"
homepage = "https://cloudhal.dev"
authors = ["Cloudhal contributors"]

[workspace.metadata]
name = "cloudhal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.60"
regress = "0.12"

# docs/engineering/code-structure.md: function size, complexity and nesting limits.
[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
