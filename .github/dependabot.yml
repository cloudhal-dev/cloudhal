version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-tooling: { patterns: ["@biomejs/*", "turbo", "vitest", "typescript", "@changesets/*", "tsx"] }
      # better-auth and its plugins share exact internal versions (@better-auth/core, utils,
      # better-call): bumping one alone breaks npm installs of @cloudhal/api (see its pins test).
      better-auth: { patterns: ["better-auth", "@better-auth/*", "better-call"] }
      tiptap: { patterns: ["@tiptap/*"] }
    ignore:
      # Generators are pinned exactly; bump them deliberately with a regen + ADR note.
      - dependency-name: json-schema-to-typescript
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
