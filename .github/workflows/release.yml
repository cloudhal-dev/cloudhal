name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  changesets:
    name: Version or publish (Changesets)
    # Publishing is gated until the npm org `cloudhal` exists and trusted publishing is
    # configured: set the repository variable RELEASE_ENABLED=true to turn it on.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish to npm
        # changesets/action v2: kebab-case inputs, and the token goes in `github-token` (the
        # GITHUB_TOKEN environment variable is no longer read). npm auth stays trusted publishing.
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
  # crates.io publishing is added once cloudhal-schema reaches 0.1 (see docs/adr/0006).
