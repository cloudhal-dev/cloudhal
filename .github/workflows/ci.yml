name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TYPIFY_VERSION: 0.8.0

jobs:
  ts:
    name: TypeScript (lint · typecheck · test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm turbo run typecheck
      # Each vitest starts a worker per core; more than two packages at once oversubscribes the
      # 4-vCPU runner and slow tests (auth, D1, workerd) hit their timeouts.
      - run: pnpm turbo run test --concurrency=2
      - name: Publishable packages build (and publishConfig is current)
        if: matrix.node == 24
        run: |
          node scripts/build-packages.ts --check
          pnpm build:packages

  rust:
    name: Rust (test · clippy · fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rust tests validate fixtures against the bundled schemas, so bundle first.
      - run: pnpm --filter @cloudhal/core-contracts bundle
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  contract-drift:
    name: Contract drift (schema → TS + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-typify@${{ env.TYPIFY_VERSION }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudhal/core-contracts gen
      - name: Generated code must match the committed code
        run: |
          git diff --exit-code -- packages/core-contracts/src/generated crates/cloudhal-schema/src/generated \
            || { echo "::error::Generated types are out of date. Run 'pnpm gen' and commit."; exit 1; }
