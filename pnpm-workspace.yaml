packages:
  - apps/*
  - packages/*
  - capabilities/*/*
  - starters/*
  - examples/*

catalogMode: strict

catalog:
  "@biomejs/biome": 2.5.15
  "@changesets/cli": 3.0.3
  "@types/node": ^24.0.0
  ajv: 8.20.0
  ajv-formats: 3.0.1
  json-schema-to-typescript: 16.0.0
  tsx: ^4.23.15
  turbo: 2.11.7
  typescript: 7.0.2
  vitest: 5.0.3
  better-sqlite3: 13.0.3
  "@types/better-sqlite3": ^9.6.0
  miniflare: 3.20250718.3
  "@cloudflare/workers-types": ^5.20261007.1
  astro: ^7.3.6
  "@tailwindcss/vite": ^4.3.3
  tailwindcss: ^4.3.3
  marked: ^18.1.0

# Native build scripts must be explicitly approved (pnpm 12 `allowBuilds`).
allowBuilds:
  esbuild: true
  better-sqlite3: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261007.1"
