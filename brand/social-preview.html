<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:640px;background:#141413;color:#ececea;font-family:-apple-system,"Helvetica Neue",Inter,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:84px 96px;position:relative;overflow:hidden}
.glow{position:absolute;right:-180px;top:-200px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(208,100,62,.38),rgba(208,100,62,0) 65%)}
.brand{display:flex;align-items:center;gap:22px;position:relative}
.mark{width:72px;height:72px;border-radius:16px;background:#b4441f;display:flex;align-items:center;justify-content:center}
.ring{width:38px;height:38px;border-radius:50%;border:6px solid #fff;display:flex;align-items:center;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;background:#fff}
.name{font-size:52px;font-weight:600;letter-spacing:-.5px}
h1{font-size:64px;line-height:1.1;font-weight:600;max-width:980px;position:relative}
h1 em{font-style:normal;color:#ee8a64}
.foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:26px;color:#a3a39d;position:relative}
.pills{display:flex;gap:12px}
.pill{border:1.5px solid #3a3a37;border-radius:999px;padding:8px 18px;font-size:22px;color:#d6d6d2}
</style></head><body><div class="glow"></div>
<div class="brand"><img src="mark.svg" width="72" height="72" alt=""><div class="name">Cloudhal</div></div>
<h1>Sites your agents can build,<br><em>safely.</em></h1>
<div class="foot"><div class="pills"><span class="pill">MCP + policy engine</span><span class="pill">Snapshots &amp; rollback</span><span class="pill">Cloudflare or self-hosted</span></div><div>cloudhal.dev</div></div>
</body></html>
